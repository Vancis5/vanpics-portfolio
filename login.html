<!DOCTYPE html>
<html lang="en" style="background: #0d0c0c; color-scheme: dark;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>vanpics: darkroom</title>
  
  <!-- favicon -->
  <link rel="icon" type="image/svg+xml" href="icons/aperture-red.svg">
  <link rel="apple-touch-icon" href="icons/aperture-red.svg">
  <link rel="preload" href="/fonts/cormorant-garamond-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/cormorant-garamond-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/dm-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/dm-mono-300.woff2" as="font" type="font/woff2" crossorigin>
  
  <link rel="stylesheet" href="./css/admin.css">
  <script type="module" src="./js/login.ts"></script>
</head>
<body class="login-body" style="background: #0d0c0c; color-scheme: dark;">

  <div class="login-viewport-wrapper">
    <!-- Full-Screen Glassmorphic Login Portal Card -->
    <div class="login-card" style="margin: auto; width: 100%; max-width: 440px;">
      <div class="login-header">
        <h1>vanpics</h1>
        <p>darkroom</p>
      </div>
      <form id="login-form">
        <div class="login-field">
          <div class="login-input-wrapper">
            <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px; stroke: var(--text-faint); margin-right: 0.75rem; flex-shrink: 0;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="login-secret-token" class="login-input" placeholder="enter token" required autofocus autocomplete="current-password" aria-describedby="login-error-msg" aria-invalid="false" spellcheck="false">
            <button type="button" class="btn-toggle-password" id="login-toggle-password-btn" title="Toggle password visibility" aria-label="Show password" tabindex="-1" style="background: none; border: none; color: var(--text-faint); cursor: pointer; padding: 0.2rem; display: flex; align-items: center;">
              <svg id="login-eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="login-eye-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none; width: 14px; height: 14px;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <div class="login-error-message" id="login-error-msg" role="alert" aria-live="polite" style="font-size: 0.65rem; color: var(--danger); font-family: 'DM Mono', monospace; letter-spacing: 0.05em; text-transform: lowercase; min-height: 14px; padding-left: 0.2rem; margin-top: 0.4rem;"></div>
        </div>
        <div class="login-footer-row">
          <label class="remember-checkbox-wrapper">
            <input type="checkbox" id="login-remember-token">
            <span>remember token</span>
          </label>
          <button type="submit" class="btn-login-submit" id="btn-login-submit">
            <span id="login-btn-text">access catalog</span>
            <div class="spinner" id="login-btn-spinner" style="display:none; width: 14px; height: 14px;"></div>
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

</body>
</html>
