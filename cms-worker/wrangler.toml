# ─────────────────────────────────────────────────────────────────────────────
#  WRANGLER CONFIGURATION — VANPICS CMS API
# ─────────────────────────────────────────────────────────────────────────────

name = "vanpics-cms-api"
main = "src/index.js"
compatibility_date = "2026-05-29"

# 1. Serverless SQLite Database (D1)
[[d1_databases]]
binding = "DB"
database_name = "vanpics-db"
database_id = "2ba15d73-2149-4d1d-8da8-68a1221fca2f"

# 2. Media Asset Storage (R2 Bucket)
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "vanpics-media"
preview_bucket_name = "vanpics-media-local-preview"

[vars]
# Comma-separate production frontend origins, for example:
# ALLOWED_ORIGINS = "https://vanpics.example.com,https://www.vanpics.example.com"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5199,http://127.0.0.1:5199,http://192.168.0.104:5199,https://vanpics.pages.dev"
ENVIRONMENT = "production"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1


