# ─────────────────────────────────────────────────────────────────────────────
#  WRANGLER CONFIGURATION — VANPICS CMS API
# ─────────────────────────────────────────────────────────────────────────────

name = "vanpics-cms-api"
main = "src/index.js"
compatibility_date = "2026-05-29"

# 1. Serverless SQLite Database (D1)
[[d1_databases]]
binding = "DB"
database_name = "vanpics-db"
database_id = "enter-your-d1-database-uuid-after-creation"

# 2. Media Asset Storage (R2 Bucket)
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "vanpics-media"
preview_bucket_name = "vanpics-media-local-preview"

[vars]
# Comma-separate production frontend origins, for example:
# ALLOWED_ORIGINS = "https://vanpics.example.com,https://www.vanpics.example.com"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"

# Allow larger assets uploads (Workers limit is usually 100MB anyway)
[limits]
cpu_ms = 50
