<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Francis Evan</title>
  <meta name="description" content="pics by van">
  <meta property="og:title" content="Francis Evan">
  <meta property="og:description" content="pics by van">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Francis Evan">
  <meta name="twitter:description" content="pics by van">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:wght@300;400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="player.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/html/cdn/video-minimal-ui.js"></script>
  <style>
    /* ── VIDEO.JS PLAYER (motion section) ── */
    #motion-section {
      padding: 4rem 2rem 6rem;
      max-width: 860px;
      margin: 0 auto;
      opacity: 0;
      animation: fadeup 0.8s ease 0.1s forwards;
    }

    #motion-section .motion-player-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 0.75rem;
      overflow: hidden;
      background: #000;
    }

    /* Override Video.js font to DM Mono */
    #motion-section video-player,
    #motion-section video-player * {
      font-family: 'DM Mono', monospace !important;
    }

    /* Fix video fill inside our wrapper */
    #motion-section video-player {
      display: block;
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
    }

    #motion-section .motion-label {
      margin-top: 1.4rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-faint);
      opacity: 0.5;
    }
  </style>
  <!-- Video.js minimal skin CSS (inlined) -->
  <style>
    video-player {
      display: contents;
    }

    video-player video,
    video-player [slot="poster"] {
      display: block;
      width: 100%;
      height: 100%;
    }

    video-player video::-webkit-media-text-track-container {
      transition: translate var(--media-caption-track-duration, 0) ease-out;
      transition-delay: var(--media-caption-track-delay, 0);
      translate: 0 var(--media-caption-track-y, 0);
      scale: .98;
      z-index: 1;
      font-family: 'DM Mono', monospace;
    }

    media-tooltip-group {
      display: contents;
    }

    .media-popover--volume:has(media-volume-slider[data-availability="unsupported"]) {
      display: none;
    }

    .media-minimal-skin *,
    .media-minimal-skin *::before,
    .media-minimal-skin *::after {
      box-sizing: border-box;
    }

    .media-minimal-skin img,
    .media-minimal-skin video,
    .media-minimal-skin svg {
      display: block;
      max-width: 100%;
    }

    .media-minimal-skin button {
      font: inherit;
    }

    @media (prefers-reduced-motion: no-preference) {
      .media-minimal-skin {
        interpolate-size: allow-keywords;
      }
    }

    .media-minimal-skin {
      container: media-root / inline-size;
      position: relative;
      isolation: isolate;
      display: block;
      height: 100%;
      width: 100%;
      border-radius: var(--media-border-radius, 0.75rem);
      outline: 2px solid transparent;
      outline-offset: 2px;
      font-family: 'DM Mono', monospace;
      line-height: 1.5;
      letter-spacing: normal;
      -webkit-font-smoothing: auto;
      -moz-osx-font-smoothing: auto;
    }

    .media-minimal-skin>* {
      font-size: .75rem;
    }

    @container media-root (width > 48rem) {
      .media-minimal-skin>* {
        font-size: .875rem;
      }
    }

    .media-minimal-skin:focus-visible {
      outline-color: currentColor;
    }

    .media-minimal-skin ::slotted(video),
    .media-minimal-skin video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: var(--media-object-fit, contain);
      object-position: var(--media-object-position, center);
    }

    .media-minimal-skin video {
      border-radius: inherit;
    }

    .media-minimal-skin:fullscreen video {
      object-fit: contain;
    }

    .media-minimal-skin .media-overlay {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background-image: linear-gradient(to top, oklch(0 0 0 / .7), oklch(0 0 0 / .5) 7.5rem, oklch(0 0 0 / 0));
      backdrop-filter: blur(0) saturate(1);
      opacity: 0;
      pointer-events: none;
      transition-property: opacity, backdrop-filter;
      transition-duration: var(--media-controls-transition-duration);
      transition-timing-function: ease-out;
    }

    .media-minimal-skin .media-controls[data-visible]~.media-overlay {
      opacity: 1;
    }

    .media-minimal-skin .media-buffering-indicator {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      color: oklch(1 0 0);
      pointer-events: none;
    }

    .media-minimal-skin .media-buffering-indicator[data-visible] {
      display: flex;
    }

    .media-minimal-skin .media-error:not([data-open]) {
      display: none;
    }

    .media-minimal-skin .media-error__title {
      font-weight: 600;
      line-height: 1.25;
    }

    .media-minimal-skin .media-error__description {
      opacity: .7;
      overflow-wrap: anywhere;
    }

    .media-minimal-skin .media-error__actions {
      display: flex;
      gap: .5rem;
    }

    .media-minimal-skin .media-error__actions>* {
      flex: 1;
    }

    .media-minimal-skin .media-error[data-open]~.media-controls * {
      visibility: hidden;
    }

    .media-minimal-skin .media-controls {
      container: media-controls / inline-size;
      display: flex;
      align-items: center;
      --media-controls-current-shadow-color: oklch(from currentColor 0 0 0 / clamp(0, calc((l - 0.5) * 0.5), 0.15));
      background-color: var(--media-controls-background-color);
      backdrop-filter: var(--media-controls-backdrop-filter);
      text-shadow: 0 1px 0 var(--media-controls-current-shadow-color);
    }

    .media-minimal-skin .media-time-controls {
      container: media-time-controls / inline-size;
      display: flex;
      flex-direction: row-reverse;
      align-items: center;
      flex: 1;
      gap: .75rem;
    }

    .media-minimal-skin .media-time-group {
      display: flex;
      align-items: center;
      gap: .25rem;
    }

    .media-minimal-skin .media-time {
      font-variant-numeric: tabular-nums;
      font-family: 'DM Mono', monospace;
    }

    .media-minimal-skin .media-time--current,
    .media-minimal-skin .media-time-separator {
      display: none;
    }

    @container media-root (width > 42rem) {
      .media-minimal-skin .media-time-controls {
        flex-direction: row;
      }

      .media-minimal-skin .media-time--duration,
      .media-minimal-skin .media-time-separator {
        color: oklch(from currentColor l c h / .6);
      }

      .media-minimal-skin .media-time--current,
      .media-minimal-skin .media-time-separator {
        display: inline;
      }
    }

    .media-minimal-skin .media-button {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: .5rem 1rem;
      border: none;
      border-radius: .5rem;
      outline: 2px solid transparent;
      outline-offset: -2px;
      transition-property: background-color, outline-offset, scale;
      will-change: scale;
      transition-duration: 150ms;
      transition-timing-function: ease-out;
      cursor: pointer;
      user-select: none;
      text-align: center;
      touch-action: manipulation;
      font-family: 'DM Mono', monospace;
    }

    .media-minimal-skin .media-button:focus-visible {
      outline-color: currentColor;
      outline-offset: 2px;
    }

    .media-minimal-skin .media-button:active {
      scale: .98;
    }

    .media-minimal-skin .media-button[disabled] {
      opacity: .5;
      filter: grayscale(1);
      cursor: not-allowed;
    }

    .media-minimal-skin .media-button[data-availability="unavailable"] {
      display: none;
    }

    .media-minimal-skin .media-button--primary {
      background: oklch(1 0 0);
      color: oklch(0 0 0);
      font-weight: 500;
      text-shadow: none;
    }

    .media-minimal-skin .media-button--subtle {
      background: transparent;
      color: inherit;
      text-shadow: inherit;
    }

    .media-minimal-skin .media-button--subtle:hover,
    .media-minimal-skin .media-button--subtle:focus-visible,
    .media-minimal-skin .media-button--subtle[aria-expanded="true"] {
      background: oklch(from currentColor l c h / .1);
    }

    .media-minimal-skin .media-button--icon {
      display: grid;
      width: 2.375rem;
      padding: 0;
      aspect-ratio: 1;
    }

    .media-minimal-skin .media-button--icon:active {
      scale: .9;
    }

    .media-minimal-skin .media-button--icon .media-icon {
      filter: drop-shadow(0 1px 0 var(--media-controls-current-shadow-color, oklch(0 0 0 / .25)));
    }

    .media-minimal-skin .media-button--seek .media-icon__label {
      position: absolute;
      right: -1px;
      bottom: -3px;
      font-size: 10px;
      font-weight: 480;
      font-variant-numeric: tabular-nums;
      font-family: 'DM Mono', monospace;
    }

    .media-minimal-skin .media-button--seek:has(.media-icon--flipped) .media-icon__label {
      right: unset;
      left: -1px;
    }

    .media-minimal-skin .media-button--playback-rate {
      padding: 0;
    }

    .media-minimal-skin .media-button--playback-rate::after {
      content: attr(data-rate) "\00D7";
      width: 4ch;
      font-variant-numeric: tabular-nums;
      font-family: 'DM Mono', monospace;
    }

    .media-minimal-skin .media-button-group {
      display: flex;
      align-items: center;
      gap: .075rem;
    }

    @container media-root (width > 42rem) {
      .media-minimal-skin .media-button-group {
        gap: .125rem;
      }
    }

    .media-minimal-skin .media-icon__container {
      position: relative;
    }

    .media-minimal-skin .media-icon {
      display: block;
      flex-shrink: 0;
      grid-area: 1 / 1;
      width: 18px;
      height: 18px;
      transition-behavior: allow-discrete;
      transition-property: display, opacity;
      transition-duration: 150ms;
      transition-timing-function: ease-out;
    }

    .media-minimal-skin .media-icon--flipped {
      scale: -1 1;
    }

    .media-minimal-skin .media-slider {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      border-radius: calc(infinity * 1px);
      outline: none;
      cursor: pointer;
    }

    .media-minimal-skin .media-slider[data-orientation="horizontal"] {
      min-width: 5rem;
      width: 100%;
      height: 2rem;
    }

    .media-minimal-skin .media-slider[data-orientation="vertical"] {
      width: 2rem;
      height: 4.5rem;
    }

    .media-minimal-skin .media-slider__track {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border-radius: inherit;
      user-select: none;
      background-color: oklch(from currentColor l c h / .2);
    }

    .media-minimal-skin .media-slider__track[data-orientation="horizontal"] {
      width: 100%;
      height: .1875rem;
    }

    .media-minimal-skin .media-slider__track[data-orientation="vertical"] {
      width: .1875rem;
      height: 100%;
    }

    .media-minimal-skin .media-slider__thumb {
      position: absolute;
      translate: -50% -50%;
      z-index: 10;
      width: .75rem;
      height: .75rem;
      background-color: currentColor;
      border-radius: calc(infinity * 1px);
      opacity: 0;
      scale: .7;
      transform-origin: center;
      transition-property: opacity, scale, outline-offset;
      transition-duration: 150ms;
      transition-timing-function: ease-out;
      user-select: none;
      outline: 2px solid transparent;
      outline-offset: -2px;
    }

    .media-minimal-skin .media-slider__thumb[data-orientation="horizontal"] {
      top: 50%;
      left: var(--media-slider-fill);
    }

    .media-minimal-skin .media-slider__thumb[data-orientation="vertical"] {
      left: 50%;
      top: calc(100% - var(--media-slider-fill));
    }

    .media-minimal-skin .media-slider__thumb:focus-visible {
      outline-color: currentColor;
      outline-offset: 2px;
    }

    .media-minimal-skin .media-slider:hover .media-slider__thumb,
    .media-minimal-skin .media-slider:focus-within .media-slider__thumb,
    .media-minimal-skin .media-slider__thumb--persistent {
      opacity: 1;
      scale: 1;
    }

    .media-minimal-skin .media-slider__buffer,
    .media-minimal-skin .media-slider__fill {
      position: absolute;
      border-radius: inherit;
      pointer-events: none;
    }

    .media-minimal-skin .media-slider__buffer[data-orientation="horizontal"],
    .media-minimal-skin .media-slider__fill[data-orientation="horizontal"] {
      inset-block: 0;
      left: 0;
    }

    .media-minimal-skin .media-slider__buffer[data-orientation="vertical"],
    .media-minimal-skin .media-slider__fill[data-orientation="vertical"] {
      inset-inline: 0;
      bottom: 0;
    }

    .media-minimal-skin .media-slider__buffer {
      background-color: oklch(from currentColor l c h / .2);
      transition-duration: .25s;
      transition-timing-function: ease-out;
    }

    .media-minimal-skin .media-slider__buffer[data-orientation="horizontal"] {
      width: var(--media-slider-buffer);
      transition-property: width;
    }

    .media-minimal-skin .media-slider__buffer[data-orientation="vertical"] {
      height: var(--media-slider-buffer);
      transition-property: height;
    }

    .media-minimal-skin .media-slider__fill {
      background-color: currentColor;
    }

    .media-minimal-skin .media-slider__fill[data-orientation="horizontal"] {
      width: var(--media-slider-fill);
    }

    .media-minimal-skin .media-slider__fill[data-orientation="vertical"] {
      height: var(--media-slider-fill);
    }

    .media-minimal-skin .media-slider[data-dragging] .media-slider__thumb[data-orientation="horizontal"] {
      left: var(--media-slider-pointer);
    }

    .media-minimal-skin .media-slider[data-dragging] .media-slider__thumb[data-orientation="vertical"] {
      top: calc(100% - var(--media-slider-pointer));
    }

    .media-minimal-skin .media-slider[data-dragging] .media-slider__fill[data-orientation="horizontal"] {
      width: var(--media-slider-pointer);
    }

    .media-minimal-skin .media-slider[data-dragging] .media-slider__fill[data-orientation="vertical"] {
      height: var(--media-slider-pointer);
    }

    .media-minimal-skin .media-popover,
    .media-minimal-skin .media-tooltip {
      margin: 0;
      border: 0;
      color: inherit;
      overflow: visible;
      transition-property: scale, opacity, filter;
      transition-duration: var(--media-popup-transition-duration);
      transition-timing-function: var(--media-popup-transition-timing-function);
    }

    .media-minimal-skin .media-popover[data-starting-style],
    .media-minimal-skin .media-popover[data-ending-style],
    .media-minimal-skin .media-tooltip[data-starting-style],
    .media-minimal-skin .media-tooltip[data-ending-style] {
      opacity: 0;
      scale: .5;
      filter: blur(8px);
    }

    .media-minimal-skin .media-popover[data-instant],
    .media-minimal-skin .media-tooltip[data-instant] {
      transition-duration: 0ms;
    }

    .media-minimal-skin .media-popover[data-side="top"],
    .media-minimal-skin .media-tooltip[data-side="top"] {
      transform-origin: bottom;
    }

    .media-minimal-skin .media-popover[data-side="bottom"],
    .media-minimal-skin .media-tooltip[data-side="bottom"] {
      transform-origin: top;
    }

    .media-minimal-skin .media-tooltip {
      padding: .25rem .5rem;
      border-radius: .5rem;
      background-color: var(--media-tooltip-background-color);
      backdrop-filter: var(--media-tooltip-backdrop-filter);
      box-shadow: 0 0 0 1px var(--media-tooltip-border-color), 0 4px 6px -1px oklch(0 0 0 / .1), 0 2px 4px -2px oklch(0 0 0 / .1);
      color: var(--media-tooltip-text-color);
      font-size: .75rem;
      white-space: nowrap;
      font-family: 'DM Mono', monospace;
    }

    .media-minimal-skin .media-popover--volume:has(media-volume-slider[data-availability="unsupported"]) {
      display: none;
    }

    /* Icon state visibility */
    .media-button--play .media-icon--restart,
    .media-button--play .media-icon--play,
    .media-button--play .media-icon--pause,
    .media-button--mute .media-icon--volume-off,
    .media-button--mute .media-icon--volume-low,
    .media-button--mute .media-icon--volume-high,
    .media-button--fullscreen .media-icon--fullscreen-enter,
    .media-button--fullscreen .media-icon--fullscreen-exit,
    .media-button--captions .media-icon--captions-off,
    .media-button--captions .media-icon--captions-on {
      display: none;
      opacity: 0;
    }

    .media-button--play[data-ended] .media-icon--restart,
    .media-button--play:not([data-ended])[data-paused] .media-icon--play,
    .media-button--play:not([data-paused]):not([data-ended]) .media-icon--pause,
    .media-button--mute[data-muted] .media-icon--volume-off,
    .media-button--mute:not([data-muted])[data-volume-level="low"] .media-icon--volume-low,
    .media-button--mute:not([data-muted]):not([data-volume-level="low"]) .media-icon--volume-high,
    .media-button--fullscreen:not([data-fullscreen]) .media-icon--fullscreen-enter,
    .media-button--fullscreen[data-fullscreen] .media-icon--fullscreen-exit {
      display: block;
      opacity: 1;
    }

    /* Video skin root */
    .media-minimal-skin--video {
      overflow: clip;
      background: oklch(0 0 0);
      --media-border-color: oklch(0 0 0 / .15);
      --media-video-border-radius: var(--media-border-radius, 0.75rem);
      --media-controls-background-color: transparent;
      --media-controls-transition-duration: 100ms;
      --media-controls-transition-timing-function: ease-out;
      --media-error-dialog-transition-duration: 150ms;
      --media-error-dialog-transition-delay: 100ms;
      --media-popup-transition-duration: 100ms;
      --media-popup-transition-timing-function: ease-out;
      --media-tooltip-background-color: oklch(1 0 0 / .1);
      --media-tooltip-border-color: transparent;
      --media-tooltip-backdrop-filter: blur(16px) saturate(1.5);
      --media-tooltip-text-color: currentColor;
      --media-tooltip-side-offset: .5rem;
      --media-popover-side-offset: 1.5rem;
    }

    .media-minimal-skin--video::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 10;
      border-radius: inherit;
      box-shadow: inset 0 0 0 1px var(--media-border-color);
      pointer-events: none;
    }

    .media-minimal-skin--video:fullscreen {
      --media-border-radius: 0;
    }

    .media-minimal-skin--video .media-controls {
      padding: .25rem;
      column-gap: .5rem;
      flex-wrap: wrap;
      position: absolute;
      bottom: .25rem;
      inset-inline: .25rem;
      z-index: 10;
      color: oklch(1 0 0);
      border-radius: .75rem;
      transition-duration: var(--media-controls-transition-duration);
      transition-timing-function: var(--media-controls-transition-timing-function);
      will-change: translate, filter, opacity;
      transition-property: translate, filter, opacity;
    }

    .media-minimal-skin--video .media-controls:not([data-visible]) {
      opacity: 0;
      pointer-events: none;
      translate: 0 100%;
      filter: blur(8px);
    }

    .media-minimal-skin--video .media-controls .media-time-controls {
      order: -1;
      flex: 0 0 100%;
      padding-inline: .625rem;
    }

    .media-minimal-skin--video .media-controls .media-button-group:first-child {
      flex: 1;
      text-align: left;
    }

    .media-minimal-skin--video .media-controls .media-button-group:last-child {
      flex: 1;
      justify-content: end;
    }

    @container media-root (width > 42rem) {
      .media-minimal-skin--video .media-controls {
        flex-wrap: nowrap;
        bottom: .5rem;
        inset-inline: .5rem;
      }

      .media-minimal-skin--video .media-controls .media-time-controls {
        order: unset;
        flex: 1;
      }

      .media-minimal-skin--video .media-controls .media-button-group:first-child,
      .media-minimal-skin--video .media-controls .media-button-group:last-child {
        flex: 0 0 auto;
      }
    }

    .media-minimal-skin--video:has(.media-controls:not([data-visible])) {
      cursor: none;
    }

    .media-minimal-skin--video .media-slider__track {
      box-shadow: 0 0 0 1px oklch(0 0 0 / .05);
    }

    .media-minimal-skin--video .media-popover--volume {
      background: transparent;
      padding-block: .75rem;
      border-radius: .75rem;
    }
  </style>
  <style>
    /* LOADER */
    #loader {
      position: fixed;
      inset: 0;
      background: #111010;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.7s ease;
    }

    #loader.lifting {
      opacity: 0;
      pointer-events: none;
    }

    #gallery-header .active {
      color: var(--text);
      cursor: default;
    }

    .empty-state {
      column-span: all;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20vh 0;
      min-height: 100vh;
      /* Prevents height snapping from bottom of long lists */
      opacity: 0;
      animation: fadeup 0.8s ease 0.3s forwards;
    }

    .empty-state p {
      font-family: 'DM Mono', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      color: var(--text-faint);
      opacity: 0.6;
      text-transform: uppercase;
    }

    #loader-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(221, 216, 207, 0.35);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.25;
        transform: scale(1);
      }

      50% {
        opacity: 0.8;
        transform: scale(1.4);
      }
    }

    /* glow ball - desktop only */
    @media (hover: hover) and (pointer: fine) {
      #glow-ball {
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        pointer-events: none;
        z-index: 1;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(210, 140, 40, 0.18) 0%, rgba(180, 100, 20, 0.08) 40%, transparent 70%);
        transition: opacity 0.4s ease;
        will-change: left, top;
      }
    }

    /* swipe hint for mobile */
    #swipe-hint {
      display: none;
    }

    @media (hover: none) {
      #swipe-hint {
        display: flex;
        position: fixed;
        bottom: 12vh;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        align-items: center;
        gap: 0.5rem;
        opacity: 0;
        transition: opacity 0.4s ease;
        pointer-events: none;
      }

      #swipe-hint.visible {
        opacity: 1;
      }

      #swipe-hint span {
        font-family: 'DM Mono', monospace;
        font-size: 0.55rem;
        letter-spacing: 0.15em;
        color: rgba(221, 216, 207, 0.35);
        text-transform: lowercase;
      }
    }



    /* scroll reveal for gallery cards */
    /* !!! DONT TOUCH !!! - Handles the complex X/Y reveal logic */
    /* Vertical lift for standard scrolling */
    .photo-card {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .photo-card.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    /* Horizontal slide for subnav category switching */
    #masonry.switching {
      animation: masonrySlide 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes masonrySlide {
      from {
        opacity: 0;
        transform: translateX(var(--masonry-x, 30px));
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* lightbox image — transitions handled via inline JS for directional control */
    #lightbox-img {
      transition: opacity 0.28s ease, transform 0.36s cubic-bezier(0.16, 1, 0.3, 1);
      min-height: 160px;
      background: rgba(221, 216, 207, 0.04);
      border-radius: 3px;
      will-change: opacity, transform;
    }

    /* skeleton pulse while image is loading (opacity 0 = still loading) */
    #lightbox-img[src=""] {
      animation: imgSkeleton 1.4s ease-in-out infinite;
    }

    @keyframes imgSkeleton {

      0%,
      100% {
        background: rgba(221, 216, 207, 0.03);
      }

      50% {
        background: rgba(221, 216, 207, 0.07);
      }
    }

    /* lightbox info — keyframe only, no CSS transition to avoid double-fire */
    #lightbox-info {
      opacity: 0;
      --lb-from-x: 0px;
      --lb-from-y: 12px;
    }

    #lightbox-info.sliding {
      opacity: 0;

    @keyframes lbInfoIn {
      from {

      from {
        opacity: 1;
        filter: blur(0px);
      }

      to {
        opacity: 0;

      }
    }

    #lightbox-info.animating {
      animation: lbInfoIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      will-change: filter, opacity, transform;
    }

    function slugify(text) {
      return text.toString().toLowerCase().trim()

        .replace(/--+/g, '-');    // Replace multiple - with single -
    }
    var currentCategory = 'all';

    function getPhotoLibrary(category) {
      if (category === 'motion') return [];
      return photos.filter(function (p) {
        if (!p.title) return false;
        if (category === 'portrait') return p.category === 'portrait';
        return p.category !== 'portrait';
      });
    }

    function updateActivePhotos() {
      activePhotos = getPhotoLibrary(currentCategory);
    }

    updateActivePhotos();
    carouselPhotos = photos.filter(function (p) { return p.heroSlide === true && p.title !== ''; });
    if (carouselPhotos.length === 0) carouselPhotos = photos.filter(function (p) { return p.title !== ''; });

    // Pre-cache first 6 carousel images to warm up the browser cache without triggering "unused preload" warnings
    carouselPhotos.slice(0, 6).forEach(function (p) {
      var img = new Image();
      img.src = p.src;
    });
    var cur = 0;

    var heroVisible = true, pageVisible = true;

    var glowBall = document.getElementById('glow-ball');
    var glowX = window.innerWidth / 2, glowY = window.innerHeight / 2;
    var glowTargetX = glowX, glowTargetY = glowY;

    if (glowBall) {
      var hero = document.getElementById('hero');
      var mouseInHero = false;
      hero.addEventListener('mouseenter', function () { mouseInHero = true; startLoops(); });
      hero.addEventListener('mouseleave', function () { mouseInHero = false; });
      hero.addEventListener('mousemove', function (e) {
        var rect = hero.getBoundingClientRect();
        glowTargetX = e.clientX - rect.left;
        glowTargetY = e.clientY - rect.top;
      });
      function animateGlow() {
        var scrollFade = Math.max(0, 1 - (window.scrollY / 350));
        var targetOp = (mouseInHero && heroVisible && pageVisible) ? scrollFade : 0;

        if (glowBall.style.opacity != targetOp) {
          glowBall.style.opacity = targetOp;
        }

        // Stop loop only if target is 0 AND transition is essentially done
        if (targetOp === 0 && (!glowBall.style.opacity || parseFloat(glowBall.style.opacity) < 0.01)) {
          glowRafId = null;
          return;
        }

        glowX += (glowTargetX - glowX) * 0.08;

        var currentYear = p.date ? (p.date.match(/\d{4}/) || ["undated"])[0] : "undated";

        if (currentYear !== lastYear) {
          var header = document.createElement('div');
          header.className = 'date-header';
          header.textContent = currentYear;
          m.appendChild(header);
          lastYear = currentYear;
        }

        var card = document.createElement('div');
        card.className = 'photo-card';
        var imgEl = document.createElement('img');
        var thumbPath = p.src.replace('photos/', 'photos/thumbs/');
        imgEl.src = thumbPath;
        imgEl.alt = p.title;
        imgEl.loading = 'lazy';

        // apply pre-calculated ratio immediately — kills CLS on first visit
        if (p.aspectRatio && p.aspectRatio !== 0) {
          imgEl.style.aspectRatio = p.aspectRatio;
        } else {
          // fallback: check localStorage cache
          var cached = ratioCache[p.src];
          if (cached) {
            imgEl.style.aspectRatio = cached;
          } else {
            // first visit (no hardcoded ratio): read after load and cache it
            imgEl.addEventListener('load', function () {
              if (imgEl.naturalWidth && imgEl.naturalHeight) {
                var r = (imgEl.naturalWidth / imgEl.naturalHeight).toFixed(4);
                ratioCache[p.src] = r;
                imgEl.style.aspectRatio = r;
                saveRatioCache();
              }
            });
          }
        }

        var overlay = document.createElement('div');
        overlay.className = 'photo-card-overlay';
        overlay.innerHTML = '<div class="photo-card-title">' + p.title + '</div><div class="photo-card-date">' + (p.date || "undated") + '</div>';
        card.appendChild(imgEl);
        card.appendChild(overlay);
        card.style.transitionDelay = '0s';

        // If we just switched categories, reveal the on-screen cards instantly 
        // to ensure the transition is purely Horizontal (Masonry slide)
        var rect = card.getBoundingClientRect();
        var isVisible = (i < 12); // Heuristic for initial screen batch
        if (currentCategory !== 'all' || i < 20) {
          // We'll let revealCards handle the actual intersection, 
          // but we can bypass the animation for the initial switch.
        }

        card.addEventListener('click', (function (idx) {
          return function () { openLightbox(idx); };
        })(i));
        m.appendChild(card);
      });

      // Special handling for the switch reveal
      if (m.classList.contains('switching')) {
        // Force instant reveal for top cards so they ONLY slide horizontally
        setTimeout(function () {
          var topCards = m.querySelectorAll('.photo-card');
          topCards.forEach(function (c, idx) {
            var r = c.getBoundingClientRect();
            if (r.top < window.innerHeight) {
              c.style.transition = 'none'; // Kill vertical lift
              c.classList.add('revealed');
              setTimeout(function () { c.style.transition = ''; }, 100);
            }
          });
        }, 0);
      }

      setTimeout(revealCards, 150);
    }

    function buildMotionGrid() {
      var m = document.getElementById('masonry');
      var lastYear = null;

      motionProjects.forEach(function (item, idx) {
        var motionYear = item.date ? (item.date.match(/\d{4}/) || ['undated'])[0] : 'undated';
        if (motionYear !== lastYear) {
          var header = document.createElement('div');
          header.className = 'date-header motion-year-header';
          header.textContent = motionYear;
          m.appendChild(header);
          lastYear = motionYear;
        }

        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'motion-card';
        card.setAttribute('aria-label', 'Open video ' + item.title);

        var thumbMarkup;
        if (item.thumbnailUrl) {
          var ratio = item.aspectRatio || (16 / 9);
          thumbMarkup = '<img src="' + item.thumbnailUrl + '" alt="' + escapeHtml(item.title) + '" loading="lazy" style="aspect-ratio:' + ratio + ';width:100%;display:block;">';
        } else {
          thumbMarkup = '<div class="motion-card-fallback" style="aspect-ratio:' + (item.aspectRatio || (16 / 9)) + ';" aria-hidden="true"></div>';
        }

        card.innerHTML = [
          thumbMarkup,
          '<div class="motion-card-overlay"><div class="motion-card-title">' + escapeHtml(item.title) + '</div></div>'
        ].join('');
        card.addEventListener('click', function () {
          openLightbox(idx, 0, true);
        });
        m.appendChild(card);
      });
    }


    // PARALLAX
    var scrollY = 0;
    window.addEventListener('scroll', function () { scrollY = window.scrollY; }, { passive: true });

    // CAROUSEL
    var ROW_CONFIG = [{ dir: -1 }, { dir: 1 }, { dir: -1 }, { dir: 1 }];
    // cruise speed scaled by device — mobile narrower so same px/frame looks faster
    var CRUISE_SPEED = isMobile ? 0.28 : (window.innerWidth < 1024 ? 0.36 : 0.45);
    var EASE_FRAMES = 120;
    var START_SPEED_MULT = 8.0;

    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function getCurrentSpeed(frame) {
      if (frame >= EASE_FRAMES) return CRUISE_SPEED;
      var t = frame / EASE_FRAMES;
      return CRUISE_SPEED * START_SPEED_MULT + (CRUISE_SPEED - CRUISE_SPEED * START_SPEED_MULT) * easeOutCubic(t);
    }

    var rowState = ROW_CONFIG.map(function (c) { return { dir: c.dir, offset: 0, setWidth: 0 }; });
    var easeFrame = 0;

    function buildCarousel() {
      var rowIds = ['row-0', 'row-1', 'row-2', 'row-3'];
      var rows = rowIds.map(function (id) { return document.getElementById(id); });

      // show/hide row-3 based on device
      if (isMobile) {
        rows[3].style.display = 'flex';
      } else {
        rows[3].style.display = 'none';
      }

      var activeRows = isMobile ? rows : rows.slice(0, 3);
      var activeRowCount = activeRows.length;

      if (carouselPhotos.length === 0) { startLoops(); return; }

      // rows stay visible; eager images handle their own fade-in
      activeRows.forEach(function (r) { r.style.opacity = '1'; });

      var groups = [];
      for (var g = 0; g < activeRowCount; g++) groups.push([]);
      carouselPhotos.forEach(function (p, i) { groups[i % activeRowCount].push(p); });

      var eagerImgs = [];

      activeRows.forEach(function (row, ri) {
        var group = groups[ri].length > 0 ? groups[ri] : carouselPhotos;
        var copies = Math.max(2, Math.ceil((window.innerWidth * 3) / 220 / group.length));

        for (var c = 0; c < copies * 2; c++) {
          group.forEach(function (p) {
            var img = document.createElement('img');
            var thumbPath = p.src.replace('photos/', 'photos/thumbs/');
            img.src = thumbPath; img.alt = p.title; img.draggable = false;
            if (c === 0) {
              img.loading = 'eager';
              // start invisible — fade in on load so images don't cut in on cold load
              img.style.opacity = '0';
              img.addEventListener('load', function () { img.style.opacity = '1'; });
              img.addEventListener('error', function () { img.style.opacity = '1'; });
              eagerImgs.push(img);
            } else {
              img.loading = 'lazy';
            }
            img.addEventListener('click', function () {
              var targetCat = (p.category === 'portrait') ? 'portrait' : 'all';
              if (currentCategory === targetCat) {
                var idx = activePhotos.indexOf(p);
                if (idx >= 0) openLightbox(idx);
              } else {
                rebuildGallery(targetCat);
                // Wait for the async rebuildGallery to update activePhotos
                setTimeout(function () {
                  var idx = activePhotos.indexOf(p);
                  if (idx >= 0) openLightbox(idx);
                }, 100);
              }
            });
            row.appendChild(img);
          });
        }
      });

      var loaded = 0;
      var total = eagerImgs.length;

      function onImageReady() {
        if (++loaded < total) return;
        // defer to next paint — Firefox offsetWidth is 0 if read before layout pass
        requestAnimationFrame(function () {
          activeRows.forEach(function (row, ri) {
            var group = groups[ri].length > 0 ? groups[ri] : carouselPhotos;
            var copies = Math.max(2, Math.ceil((window.innerWidth * 3) / 220 / group.length));
            var imgs = Array.from(row.querySelectorAll('img'));
            var w = 0;
            for (var i = 0; i < group.length * copies && i < imgs.length; i++) w += (imgs[i].offsetWidth || 220) + 10;
            rowState[ri].setWidth = w > 0 ? w : group.length * copies * 230;
            if (ROW_CONFIG[ri].dir === 1) rowState[ri].offset = -rowState[ri].setWidth;
          });
          activeRows.forEach(function (r) { r.style.opacity = '1'; }); // already visible, belt-and-suspenders
          if (window.__onCarouselReady) window.__onCarouselReady();
          startLoops();
        });
      }

      if (total === 0) { activeRows.forEach(function (r) { r.style.opacity = '1'; }); startLoops(); return; }
      eagerImgs.forEach(function (img) {
        var counted = false;
        function countOnce() { if (!counted) { counted = true; onImageReady(); } }
        img.addEventListener('load', countOnce);
        img.addEventListener('error', countOnce);
        if (img.complete) {
          // already cached — decode() waits for pixel decode before resolving
          if (img.decode) {
            img.decode().then(countOnce).catch(countOnce);
          } else {
            // no decode() — nudge src to retrigger load event (cached, no network hit)
            var s = img.src; img.src = ''; img.src = s;
          }
        }
      });
    }

    function tick() {
      if (!heroVisible || !pageVisible) { heroRafId = null; return; }
      var rowIds = isMobile ? ['row-0', 'row-1', 'row-2', 'row-3'] : ['row-0', 'row-1', 'row-2'];
      var rows = rowIds.map(function (id) { return document.getElementById(id); });
      var speed = getCurrentSpeed(easeFrame);
      if (easeFrame < EASE_FRAMES + 10) easeFrame++;

      var px = [scrollY * 0.18, -scrollY * 0.12, scrollY * 0.22, -scrollY * 0.15];

      rowState.forEach(function (state, ri) {
        if (ri >= rows.length) return;
        state.offset += speed * state.dir;
        if (state.setWidth > 0) {
          if (state.dir === -1 && state.offset < -state.setWidth) state.offset += state.setWidth;
          if (state.dir === 1 && state.offset > 0) state.offset -= state.setWidth;
        }
        rows[ri].style.transform = 'translateX(' + (state.offset + px[ri]) + 'px)';
      });

      heroRafId = requestAnimationFrame(tick);
    }

    // CURSOR - mouse only
    var isMouseDevice = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    if (isMouseDevice) {
      var cursor = document.getElementById('cursor');
      var ring = document.getElementById('cursor-ring');
      var mx = 0, my = 0, rx = 0, ry = 0;
      var cursorVisible = false;

      document.addEventListener('mousemove', function (e) {
        mx = e.clientX; my = e.clientY;
        cursor.style.left = mx + 'px'; cursor.style.top = my + 'px';
        if (!cursorVisible) {
          cursorVisible = true;
          cursor.style.opacity = '1'; ring.style.opacity = '1';
        }
      });
      (function animateRing() { rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12; ring.style.left = rx + 'px'; ring.style.top = ry + 'px'; requestAnimationFrame(animateRing); })();
      // Respond to hold (mousedown)
      window.addEventListener('mousedown', function () {
        cursor.style.transform = 'translate(-50%,-50%) scale(0.65)';
        ring.style.transform = 'translate(-50%,-50%) scale(0.9)';
      });
      window.addEventListener('mouseup', function () {
        cursor.style.transform = 'translate(-50%,-50%) scale(1)';
        ring.style.transform = 'translate(-50%,-50%) scale(1)';
      });
      // Fade out when cursor leaves the viewport — use both document and documentElement for cross-browser coverage
      function hideCursor() { cursor.style.opacity = '0'; ring.style.opacity = '0'; cursorVisible = false; }
      function showCursor() { if (cursorVisible) return; cursorVisible = true; cursor.style.opacity = '1'; ring.style.opacity = '1'; }
      document.addEventListener('mouseleave', hideCursor);
      document.documentElement.addEventListener('mouseleave', hideCursor);
      document.addEventListener('mouseenter', showCursor);
      document.documentElement.addEventListener('mouseenter', showCursor);
      document.addEventListener('contextmenu', function () { hideCursor(); cursor.style.transform = 'translate(-50%,-50%) scale(0.6)'; });
      // Delegated hover for cursor ring — works on dynamically added cards and carousel imgs
      var interactiveSelector = 'button, .photo-card, #scroll-hint, .carousel-row img';
      document.addEventListener('mouseover', function (e) {
        if (e.target.matches(interactiveSelector) || e.target.closest('.photo-card, #scroll-hint')) {
          ring.style.width = '44px'; ring.style.height = '44px'; ring.style.borderColor = 'rgba(221,216,207,0.4)';
        }
      });
      document.addEventListener('mouseout', function (e) {
        if (e.target.matches(interactiveSelector) || e.target.closest('.photo-card, #scroll-hint')) {
          ring.style.width = '28px'; ring.style.height = '28px'; ring.style.borderColor = 'rgba(221,216,207,0.25)';
        }
      });

      // reset ring when lightbox opens — hover context is lost when carousel img is covered
      window.addEventListener('lightbox-open', function () {
        ring.style.width = '28px'; ring.style.height = '28px'; ring.style.borderColor = 'rgba(221,216,207,0.25)';
      });
    }

    // FILMSTRIP
    var filmstripWrap = document.getElementById('filmstrip-wrap');
    var filmstripEl = document.getElementById('filmstrip');
    var filmstripHideTimer = null;
    var filmstripBuilt = false;
    window.addEventListener('category-change', function () {
      filmstripBuilt = false;
      if (typeof filmstripEl !== 'undefined' && filmstripEl) {
        filmstripEl.innerHTML = '';
      }
      // Also reset mobile slides if they exist
      var imgWrap = document.getElementById('lightbox-img-wrap');
      if (imgWrap) {
        var slides = imgWrap.querySelectorAll('.snap-slide');
        for (var i = 0; i < slides.length; i++) slides[i].remove();
      }
    });
    var liftZone = document.getElementById('filmstrip-lift-zone');

    function buildFilmstrip() {
      if (filmstripBuilt) return;
      filmstripBuilt = true;

      var currentSet = currentLightboxIsMotion ? motionProjects : activePhotos;

      // Photos: 52px thumb + gap, Motion: 78px thumb
      var THUMB_W = currentLightboxIsMotion ? (window.innerWidth >= 640 ? 78 : 68) : (window.innerWidth >= 640 ? 62 : 52);
      var pad = (window.innerWidth / 2) - (THUMB_W / 2);
      filmstripEl.style.paddingLeft = pad + 'px';
      filmstripEl.style.paddingRight = pad + 'px';
      filmstripEl.innerHTML = '';

      currentSet.forEach(function (p, i) {
        var thumb = document.createElement('div');
        thumb.className = 'filmstrip-thumb';
        if (currentLightboxIsMotion) thumb.classList.add('mode-motion');
        thumb.dataset.idx = i;
        var img = document.createElement('img');
        var thumbPath = currentLightboxIsMotion ? p.thumbnailUrl : p.src.replace('photos/', 'photos/thumbs/');
        img.src = thumbPath;
        img.alt = p.title;
        img.loading = 'lazy';
        thumb.appendChild(img);
        thumb.addEventListener('click', (function (idx) {
          return function () {
            var d = idx === cur ? 0 : (idx > cur ? 1 : -1);
            cur = idx;
            openLightbox(idx, d, currentLightboxIsMotion);
          };
        })(i));
        filmstripEl.appendChild(thumb);
      });

      initFilmstripDrag();
    }

    var fsRaf = null;
    var fsVelocity = 0;
    var fsTarget = 0;
    var isManuallyNavigating = false;
    var fsSyncTarget = null;
    var fsSyncRaf = null;

    // Smooth lerp loop for mobile filmstrip tracking during swipe.
    // Uses frame-rate-independent exponential decay so the filmstrip
    // chases the target position without jitter or abrupt transitions.
    function startFsSync(target) {
      fsSyncTarget = target;
      if (fsSyncRaf) return; // loop already running — just updated target
      var prevTime = 0;
      function syncLoop(time) {
        if (fsSyncTarget === null) { fsSyncRaf = null; return; }
        var dt = prevTime ? Math.min(time - prevTime, 33) : 16;
        prevTime = time;
        var current = filmstripEl.scrollLeft;
        var diff = fsSyncTarget - current;
        if (Math.abs(diff) < 0.5) {
          filmstripEl.scrollLeft = fsSyncTarget;
          fsSyncRaf = null;
          fsSyncTarget = null;
          return;
        }
        // k=14: reaches 90% in ~165ms, 99% in ~330ms
        var alpha = 1 - Math.exp(-14 * dt / 1000);
        filmstripEl.scrollLeft = current + diff * alpha;
        fsSyncRaf = requestAnimationFrame(syncLoop);
      }
      fsSyncRaf = requestAnimationFrame(syncLoop);
    }

    function stopFsSync() {
      if (fsSyncRaf) { cancelAnimationFrame(fsSyncRaf); fsSyncRaf = null; }
      fsSyncTarget = null;
    }

    function updateFilmstrip() {
      var oldActive = filmstripEl.querySelector('.filmstrip-thumb.active');
      if (oldActive) oldActive.classList.remove('active');

      var active = filmstripEl.querySelector('.filmstrip-thumb[data-idx="' + cur + '"]');
      if (active) {
        active.classList.add('active');
        var wrapW = filmstripEl.offsetWidth;
        var thumbL = active.offsetLeft;
        var thumbW = active.offsetWidth;
        fsTarget = thumbL - wrapW / 2 + thumbW / 2;
        if (!isMobile || isManuallyNavigating) {
          if (fsRaf || fsSyncRaf) {
            // If already animating, drop into lerp mode for smooth continuous chasing
            if (fsRaf) {
              cancelAnimationFrame(fsRaf);
              fsRaf = null;
            }
            startFsSync(fsTarget);
          } else {
            // Cold start: play strict smooth cubic ease 
            stopFsSync();
            var startPos = filmstripEl.scrollLeft;
            var startTime = null;
            var duration = 400; // graceful duration

            function step(time) {
              if (!startTime) startTime = time;
              var elapsed = time - startTime;
              if (elapsed >= duration) {
                filmstripEl.scrollLeft = fsTarget;
                fsRaf = null;
                isManuallyNavigating = false;
                return;
              }
              var t = Math.min(1, elapsed / duration);
              // silky ease-out-quart
              var ease = 1 - Math.pow(1 - t, 4);
              filmstripEl.scrollLeft = startPos + (fsTarget - startPos) * ease;
              fsRaf = requestAnimationFrame(step);
            }
            fsRaf = requestAnimationFrame(step);
          }
        } else {
          startFsSync(fsTarget);
        }
      }
    }

    var isUserInteracting = false;
    document.getElementById('lightbox').addEventListener('touchstart', function () {
      isUserInteracting = true;
      clearTimeout(filmstripHideTimer);
    }, { passive: true });
    window.addEventListener('touchend', function () {
      isUserInteracting = false;
      if (filmstripWrap.classList.contains('visible')) {
        clearTimeout(filmstripHideTimer);
        filmstripHideTimer = setTimeout(hideFilmstrip, 2800);
      }
    }, { passive: true });

    document.getElementById('lightbox').addEventListener('mousedown', function () {
      isUserInteracting = true;
      clearTimeout(filmstripHideTimer);
    }, { passive: true });
    window.addEventListener('mouseup', function () {
      isUserInteracting = false;
      if (filmstripWrap.classList.contains('visible')) {
        clearTimeout(filmstripHideTimer);
        filmstripHideTimer = setTimeout(hideFilmstrip, 2800);
      }
    }, { passive: true });

    function showFilmstrip() {
      buildFilmstrip();
      updateFilmstrip();
      filmstripWrap.classList.add('visible');
      document.getElementById('lightbox').classList.add('filmstrip-visible');
      clearTimeout(filmstripHideTimer);
      if (!isUserInteracting) {
        filmstripHideTimer = setTimeout(hideFilmstrip, 2800);
      }
    }

    function hideFilmstrip() {
      filmstripWrap.classList.remove('visible');
      document.getElementById('lightbox').classList.remove('filmstrip-visible');
    }

    // keep filmstrip visible while hovering it
    filmstripWrap.addEventListener('mouseenter', function () { clearTimeout(filmstripHideTimer); });
    filmstripWrap.addEventListener('mouseleave', function () {
      // short grace — enough to prevent flicker if mouse clips the edge
      filmstripHideTimer = setTimeout(hideFilmstrip, 200);
    });
    filmstripWrap.addEventListener('touchstart', function () { clearTimeout(filmstripHideTimer); }, { passive: true });
    filmstripWrap.addEventListener('touchend', function () {
      filmstripHideTimer = setTimeout(hideFilmstrip, 2000);
    }, { passive: true });

    // invisible lift zone — hovering bottom of screen revives hidden filmstrip
    if (liftZone) {
      liftZone.addEventListener('mouseenter', function () {
        clearTimeout(filmstripHideTimer);
        showFilmstrip();
      });
      liftZone.addEventListener('mouseleave', function () {
        // if mouse left lift zone without entering filmstrip, hide immediately
        filmstripHideTimer = setTimeout(hideFilmstrip, 0);
      });
    }

    // mouse wheel scroll — momentum accumulator for smooth visual feel
    var wheelVelocity = 0;
    var wheelRafId = null;
    filmstripWrap.addEventListener('wheel', function (e) {
      e.preventDefault();
      wheelVelocity += (e.deltaY + e.deltaX) * 0.6; // accumulate, scaled down slightly
      clearTimeout(filmstripHideTimer);
      filmstripHideTimer = setTimeout(hideFilmstrip, 2000);
      if (!wheelRafId) {
        (function wheelLoop() {
          if (Math.abs(wheelVelocity) < 0.5) { wheelVelocity = 0; wheelRafId = null; return; }
          filmstripEl.scrollLeft += wheelVelocity;
          wheelVelocity *= 0.82; // friction — decay per frame
          wheelRafId = requestAnimationFrame(wheelLoop);
        })();
      }
    }, { passive: false });

    // click-drag scroll
    function initFilmstripDrag() {
      var isDragging = false;
      var dragStartX = 0;
      var scrollStart = 0;
      var dragMoved = false;

      filmstripEl.addEventListener('mousedown', function (e) {
        isDragging = true;
        dragMoved = false;
        dragStartX = e.clientX;
        scrollStart = filmstripEl.scrollLeft;
        filmstripEl.classList.add('dragging');
        clearTimeout(filmstripHideTimer);
      });

      document.addEventListener('mousemove', function (e) {
        if (!isDragging) return;
        var dx = e.clientX - dragStartX;
        if (Math.abs(dx) > 3) dragMoved = true;
        filmstripEl.scrollLeft = scrollStart - dx;
      });

      document.addEventListener('mouseup', function () {
        if (!isDragging) return;
        isDragging = false;
        filmstripEl.classList.remove('dragging');
        filmstripHideTimer = setTimeout(hideFilmstrip, 1500);
      });

      // suppress click on thumbs if we just dragged
      filmstripEl.addEventListener('click', function (e) {
        if (dragMoved) { e.stopPropagation(); dragMoved = false; }
      }, true);
    }


    // buildCarousel internally waits for images, then calls onReady
    // we hook into that by wrapping the final reveal
    function liftLoader() {
      var loader = document.getElementById('loader');
      loader.classList.add('lifting');
      setTimeout(function () { loader.style.display = 'none'; }, 750);
    }

    // Lift loader via direct callback — no MutationObserver (flaky in Firefox)
    var _loaderLifted = false;
    function safeLift() { if (!_loaderLifted) { _loaderLifted = true; liftLoader(); } }
    // Hard fallback: lift after 4s no matter what
    setTimeout(safeLift, 4000);
    // Expose for buildCarousel to call after rows are visible
    window.__onCarouselReady = function () { setTimeout(safeLift, 120); };

    buildCarousel();
    buildMasonry();
    initFilters();

    // Visibility & Animation Loop Management
    function startLoops() {
      if (heroVisible && pageVisible) {
        if (!heroRafId) heroRafId = requestAnimationFrame(tick);
        if (!glowRafId && typeof animateGlow === 'function') glowRafId = requestAnimationFrame(animateGlow);
      }
    }
    var heroObs = new IntersectionObserver(function (entries) {
      heroVisible = entries[0].isIntersecting;
      startLoops();
    }, { threshold: 0 });
    heroObs.observe(document.getElementById('hero'));
    document.addEventListener('visibilitychange', function () {
      pageVisible = !document.hidden;
      startLoops();
    });

    // Deep Link Initial Load
    function checkHash() {
      var hash = window.location.hash.substring(1);
      if (!hash) return;
      // Check photos
      for (var i = 0; i < activePhotos.length; i++) {
        if (slugify(activePhotos[i].title) === hash) {
          openLightbox(i);
          return;
        }
      }
      // Check motion
      for (var j = 0; j < motionProjects.length; j++) {
        if (slugify(motionProjects[j].title) === hash) {
          openLightbox(j, 0, true);
          return;
        }
      }
    }
    // Defer slightly to ensure layout is ready
    setTimeout(checkHash, 300);
  </script>
  <script>
    if (navigator.userAgent.toLowerCase().indexOf('firefox') > -1) {
      document.write('<script src="scripts/firefox.js"><\/script>');
    }
