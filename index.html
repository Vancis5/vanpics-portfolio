<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Francis Evan</title>
  <meta name="description" content="pics by van">
  <meta property="og:title" content="Francis Evan">
  <meta property="og:description" content="pics by van">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Francis Evan">
  <meta name="twitter:description" content="pics by van">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:wght@300;400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* LOADER */
    #loader {
      position: fixed;
      inset: 0;
      background: #111010;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.7s ease;
    }

    #loader.lifting {
      opacity: 0;
      pointer-events: none;
    }

    #loader-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(221, 216, 207, 0.35);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.25;
        transform: scale(1);
      }

      50% {
        opacity: 0.8;
        transform: scale(1.4);
      }
    }

    /* glow ball - desktop only */
    @media (hover: hover) and (pointer: fine) {
      #glow-ball {
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        pointer-events: none;
        z-index: 1;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(210, 140, 40, 0.18) 0%, rgba(180, 100, 20, 0.08) 40%, transparent 70%);
        transition: opacity 0.4s ease;
        will-change: left, top;
      }
    }

    /* swipe hint for mobile */
    #swipe-hint {
      display: none;
    }

    @media (hover: none) {
      #swipe-hint {
        display: flex;
        position: fixed;
        bottom: 12vh;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        align-items: center;
        gap: 0.5rem;
        opacity: 0;
        transition: opacity 0.4s ease;
        pointer-events: none;
      }

      #swipe-hint.visible {
        opacity: 1;
      }

      #swipe-hint span {
        font-family: 'DM Mono', monospace;
        font-size: 0.55rem;
        letter-spacing: 0.15em;
        color: rgba(221, 216, 207, 0.35);
        text-transform: lowercase;
      }
    }

    /* scroll reveal for gallery cards */
    .photo-card {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .photo-card.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    /* lightbox image — transitions handled via inline JS for directional control */
    #lightbox-img {
      transition: opacity 0.28s ease, transform 0.36s cubic-bezier(0.16, 1, 0.3, 1);
      min-height: 160px;
      background: rgba(221, 216, 207, 0.04);
      border-radius: 3px;
      will-change: opacity, transform;
    }

    /* skeleton pulse while image is loading (opacity 0 = still loading) */
    #lightbox-img[src=""] {
      animation: imgSkeleton 1.4s ease-in-out infinite;
    }

    @keyframes imgSkeleton {

      0%,
      100% {
        background: rgba(221, 216, 207, 0.03);
      }

      50% {
        background: rgba(221, 216, 207, 0.07);
      }
    }

    /* lightbox info — keyframe only, no CSS transition to avoid double-fire */
    #lightbox-info {
      opacity: 0;
      --lb-from-x: 0px;
      --lb-from-y: 12px;
    }

    #lightbox-info.sliding {
      opacity: 0;
    }

    @keyframes lbInfoIn {
      from {
        opacity: 0;
        filter: blur(6px);
        transform: translateX(var(--lb-from-x)) translateY(var(--lb-from-y));
      }

      to {
        opacity: 1;
        filter: blur(0px);
        transform: translateX(0) translateY(0);
      }
    }

    @keyframes lbInfoOut {
      from {
        opacity: 1;
        filter: blur(0px);
      }

      to {
        opacity: 0;
        filter: blur(6px);
      }
    }

    #lightbox-info.animating {
      animation: lbInfoIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      will-change: filter, opacity, transform;
    }
  </style>
</head>

<body>

  <div id="loader">
    <div id="loader-dot"></div>
  </div>
  <div id="cursor"></div>
  <div id="cursor-ring"></div>
  <section id="hero">
    <div id="glow-ball"></div>
    <div class="carousel-row" id="row-0"></div>
    <div class="carousel-row" id="row-1"></div>
    <div class="carousel-row" id="row-2"></div>
    <div class="carousel-row" id="row-3" style="display:none"></div>
    <div id="hero-identity">
      <h1>Francis Evan</h1>
      <p>a collection of things i saw</p>
    </div>
    <div id="scroll-hint" onclick="document.getElementById('gallery-section').scrollIntoView({behavior:'smooth'})">
      <span>scroll</span>
      <div class="scroll-line"></div>
    </div>
  </section>

  <section id="gallery-section">
    <div id="gallery-header">
      <p>photographs</p>
    </div>
    <div id="masonry"></div>
  </section>

  <div id="lightbox">
    <div id="lightbox-bg"></div>
    <div id="blur-layer-a" class="lightbox-bg-blur">
      <div class="lightbox-bg-blur-inner"></div>
    </div>
    <div id="blur-layer-b" class="lightbox-bg-blur">
      <div class="lightbox-bg-blur-inner"></div>
    </div>
    <button id="lightbox-close" onclick="closeLightbox()">close</button>
    <div id="lightbox-content">
      <div id="lightbox-zoom-darken"></div>
      <div id="lightbox-img-wrap">
        <img id="lightbox-img" class="zoomable" src="" alt="">
      </div>
      <div id="lightbox-info-wrap">
        <div id="lightbox-info" onclick="toggleLightboxDesc()">
          <div id="lightbox-title"></div>
          <div id="lightbox-desc"></div>
          <div id="lightbox-meta">
            <span class="meta-item" id="meta-location" style="display: none;">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
              <span id="meta-location-text"></span>
            </span>
            <span class="meta-item" id="meta-year" style="display: none;">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
              <span id="meta-year-text"></span>
            </span>
          </div>
          <button id="lightbox-desc-toggle">read</button>
        </div>
      </div>
    </div>

    <div id="filmstrip-wrap">
      <div id="filmstrip"></div>
    </div>
    <!-- invisible hit zone at bottom — always pointer-events active, lifts filmstrip on hover -->
    <div id="filmstrip-lift-zone"></div>
    <div id="swipe-hint">
      <span>&larr; swipe &rarr;</span>
    </div>
  </div>

  <footer>
    <p>francis evan lorzano &mdash; maasin city, southern leyte</p>
    <p>all rights reserved</p>
  </footer>

  <script src="photos.js"></script>
  <script>
    function slugify(text) {
      return text.toString().toLowerCase().trim()
        .replace(/\s+/g, '-')     // Replace spaces with -
        .replace(/[^\w-]+/g, '')  // Remove all non-word chars
        .replace(/--+/g, '-');    // Replace multiple - with single -
    }
    var activePhotos = photos.filter(function (p) { return p.title !== ''; });
    var carouselPhotos = activePhotos.filter(function (p) { return p.heroSlide === true; });
    if (carouselPhotos.length === 0) carouselPhotos = activePhotos;

    // preload first 6 carousel images — browser discovers them before JS fully executes
    carouselPhotos.slice(0, 6).forEach(function (p) {
      var link = document.createElement('link');
      link.rel = 'preload'; link.as = 'image'; link.href = p.src;
      document.head.appendChild(link);
    });
    var cur = 0;
    var isMobile = window.matchMedia('(hover: none)').matches;
    var heroVisible = true, pageVisible = true;
    var heroRafId = null, glowRafId = null;

    // GLOW BALL
    var glowBall = document.getElementById('glow-ball');
    var glowX = window.innerWidth / 2, glowY = window.innerHeight / 2;
    var glowTargetX = glowX, glowTargetY = glowY;

    if (glowBall) {
      var hero = document.getElementById('hero');
      var mouseInHero = false;
      hero.addEventListener('mouseenter', function () { mouseInHero = true; startLoops(); });
      hero.addEventListener('mouseleave', function () { mouseInHero = false; });
      hero.addEventListener('mousemove', function (e) {
        var rect = hero.getBoundingClientRect();
        glowTargetX = e.clientX - rect.left;
        glowTargetY = e.clientY - rect.top;
      });
      function animateGlow() {
        var scrollFade = Math.max(0, 1 - (window.scrollY / 350));
        var targetOp = (mouseInHero && heroVisible && pageVisible) ? scrollFade : 0;

        if (glowBall.style.opacity != targetOp) {
          glowBall.style.opacity = targetOp;
        }

        // Stop loop only if target is 0 AND transition is essentially done
        if (targetOp === 0 && (!glowBall.style.opacity || parseFloat(glowBall.style.opacity) < 0.01)) {
          glowRafId = null;
          return;
        }

        glowX += (glowTargetX - glowX) * 0.08;
        glowY += (glowTargetY - glowY) * 0.08;
        glowBall.style.left = glowX + 'px';
        glowBall.style.top = glowY + 'px';
        glowRafId = requestAnimationFrame(animateGlow);
      }
    }

    var blurFlip = false;
    function setLightboxBlur(src) {
      var a = document.getElementById('blur-layer-a');
      var b = document.getElementById('blur-layer-b');
      var active = blurFlip ? b : a;
      var inactive = blurFlip ? a : b;

      active.querySelector('.lightbox-bg-blur-inner').style.backgroundImage = 'url(' + src + ')';
      active.classList.add('active');
      inactive.classList.remove('active');

      blurFlip = !blurFlip;
    }

    // updates text + blur bg only — image src is set separately to avoid double-load
    function setLightboxContent(p) {
      document.getElementById('lightbox-title').textContent = p.title;
      var descEl = document.getElementById('lightbox-desc');
      descEl.innerHTML = p.desc;
      var locItem = document.getElementById('meta-location');
      if (p.location) {
        document.getElementById('meta-location-text').textContent = p.location;
        locItem.style.display = 'inline-flex';
      } else {
        locItem.style.display = 'none';
      }

      var yearItem = document.getElementById('meta-year');
      if (p.year) {
        document.getElementById('meta-year-text').textContent = p.year;
        yearItem.style.display = 'inline-flex';
      } else {
        yearItem.style.display = 'none';
      }

      // Deep Link: Automatically update the URL hash dynamically for routing tracking
      var slug = slugify(p.title);
      if (window.location.hash !== '#' + slug) {
        history.replaceState(null, null, '#' + slug);
      }

      var content = document.getElementById('lightbox-content');
      var btn = document.getElementById('lightbox-desc-toggle');

      // conditionally hide the "read" toggle when photo has no description
      if (btn) {
        var hasDesc = p.desc && p.desc.replace(/<[^>]*>/g, '').trim().length > 0;
        btn.classList.toggle('no-desc', !hasDesc);
      }

      if (content && content.classList.contains('desc-open')) {
        // Mobile: GPU FLIP to gracefully and safely collapse without dropping frames natively
        if (isMobile) {
          var imgWrap = document.getElementById('lightbox-img-wrap');
          var infoWrap = document.getElementById('lightbox-info-wrap');

          var startImg = imgWrap.getBoundingClientRect();
          var startInfo = infoWrap.getBoundingClientRect();

          descEl.style.transition = 'none';
          content.classList.remove('desc-open');
          if (btn) btn.textContent = 'read';

          var endImg = imgWrap.getBoundingClientRect();
          var endInfo = infoWrap.getBoundingClientRect();

          var dImg = startImg.top - endImg.top;
          var dInfo = startInfo.top - endInfo.top;

          imgWrap.style.transition = 'none';
          imgWrap.style.transform = 'translateY(' + dImg + 'px)';
          infoWrap.style.transition = 'none';
          infoWrap.style.transform = 'translateY(' + dInfo + 'px)';

          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              imgWrap.style.transition = 'transform 0.4s cubic-bezier(0.22,1,0.36,1)';
              imgWrap.style.transform = '';
              infoWrap.style.transition = 'transform 0.4s cubic-bezier(0.22,1,0.36,1)';
              infoWrap.style.transform = '';
              setTimeout(function () {
                descEl.style.transition = '';
                imgWrap.style.transition = '';
                infoWrap.style.transition = '';
              }, 450);
            });
          });
        } else {
          // Desktop: Hardware accelerated glide down — FLIP animation
          var imgWrap = document.getElementById('lightbox-img-wrap');
          var infoWrap = document.getElementById('lightbox-info-wrap');

          var startImg = imgWrap.getBoundingClientRect();
          var startInfo = infoWrap.getBoundingClientRect();

          content.classList.remove('desc-open');
          if (btn) btn.textContent = 'read';

          var endImg = imgWrap.getBoundingClientRect();
          var endInfo = infoWrap.getBoundingClientRect();

          var dImg = startImg.top - endImg.top;
          var dInfo = startInfo.top - endInfo.top;

          imgWrap.style.transition = 'none';
          imgWrap.style.transform = 'translateY(' + dImg + 'px)';
          infoWrap.style.transition = 'none';
          infoWrap.style.transform = 'translateY(' + dInfo + 'px)';

          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              imgWrap.style.transition = 'transform 0.4s cubic-bezier(0.22,1,0.36,1)';
              imgWrap.style.transform = '';
              infoWrap.style.transition = 'transform 0.4s cubic-bezier(0.22,1,0.36,1)';
              infoWrap.style.transform = '';
              setTimeout(function () {
                imgWrap.style.transition = '';
                infoWrap.style.transition = '';
              }, 450);
            });
          });
        }
      } else if (btn) {
        btn.textContent = 'read';
      }
    }


    function animateInfo(dir) {
      var info = document.getElementById('lightbox-info');

      // only animate exit if there's visible content (opacity > 0 means it's shown)
      var hasContent = info && parseFloat(window.getComputedStyle(info).opacity) > 0.05;
      if (hasContent) {
        // create exit ghost — absolutely positioned so it doesn't shift layout
        var ghost = info.cloneNode(true);
        ghost.style.position = 'absolute';
        ghost.style.top = info.offsetTop + 'px';
        ghost.style.left = info.offsetLeft + 'px';
        ghost.style.width = info.offsetWidth + 'px';
        ghost.style.pointerEvents = 'none';
        ghost.removeAttribute('onclick'); // prevent stale tap capture on mobile
        ghost.style.animation = 'lbInfoOut 0.22s ease forwards';
        ghost.style.willChange = 'filter, opacity';
        ghost.style.zIndex = '1';
        info.parentNode.appendChild(ghost);
        setTimeout(function () { if (ghost.parentNode) ghost.parentNode.removeChild(ghost); }, 250);
      }

      // clone-replace for enter — clean slate, no animation-cancel issues
      var fromX = dir === 0 ? 0 : (dir > 0 ? 24 : -24);
      var fromY = dir === 0 ? 16 : 0;
      var clone = info.cloneNode(true);
      clone.style.setProperty('--lb-from-x', fromX + 'px');
      clone.style.setProperty('--lb-from-y', fromY + 'px');
      clone.style.animation = 'lbInfoIn 0.55s cubic-bezier(0.22,1,0.36,1) forwards';
      clone.style.willChange = 'filter, opacity, transform';
      // clear any lingering inline transition/filter from swipe scroll handler
      clone.style.transition = '';
      clone.style.filter = '';
      info.parentNode.replaceChild(clone, info);
    }

    // increments each navigation so stale callbacks from aborted navigations are ignored
    var navGen = 0;

    function openLightbox(i, direction) {
      cur = i;
      isManuallyNavigating = true;
      var p = activePhotos[i];
      var lb = document.getElementById('lightbox');
      var img = document.getElementById('lightbox-img');

      // Mobile: already open — natively smooth scroll while locking UI logic to prevent glitches during rapid passage
      if (lb.classList.contains('open') && isMobile && mobileScrollToSlide) {
        // Fallback to 1 if direction evaluates to 0 or is mathematically missing
        var dir = (typeof direction === 'number' && direction !== 0) ? direction : 1;
        mobileScrollToSlide(i, true, dir);

        cur = i;
        updateFilmstrip();
        return;
      }

      if (lb.classList.contains('open')) {
        var dir = (typeof direction === 'number' && direction !== 0) ? direction : 1;
        var exitX = dir > 0 ? '-6%' : '6%';
        var enterX = dir > 0 ? '6%' : '-6%';
        var gen = ++navGen;

        // exit current image immediately — snappy
        img.style.transition = 'opacity 0.15s ease, transform 0.15s ease';
        img.style.opacity = '0';
        img.style.transform = 'translateX(' + exitX + ') scale(0.98)';

        // hide info panel immediately so old text isn't visible
        var infoEl = document.getElementById('lightbox-info');
        if (infoEl) {
          infoEl.style.animation = 'none';
          infoEl.style.opacity = '0';
        }

        // update blur bg immediately (visual polish) — text stays hidden until image ready
        // MOVED to afterLoad() to prevent network progressive rendering from lagging JS animations
        showFilmstrip();

        var entered = false;

        function doEnter() {
          if (entered || gen !== navGen) return;
          entered = true;

          // blank src, position off-screen, fully invisible — nothing bleeds through
          img.onload = null; img.onerror = null;
          img.src = '';
          img.style.transition = 'none';
          img.style.transform = 'translateX(' + enterX + ') scale(0.98)';
          img.style.opacity = '0';

          // assign handlers BEFORE setting src — Firefox fires load before handler if src set first
          var loadFired = false;
          function afterLoad() {
            if (loadFired || gen !== navGen) return;
            loadFired = true;
            img.onload = null; img.onerror = null;
            // set blur background only now that image is fully cached in memory, preventing thread locking
            setLightboxBlur(p.src);
            // update text content now — invisible, correct position, layout settled
            setLightboxContent(p);
            loadSwipeNeighbors();
            requestAnimationFrame(function () {
              if (gen !== navGen) return;
              // one frame for layout to commit image dimensions — then animate both together
              animateInfo(dir);
              void img.offsetWidth; // force reflow — Firefox needs this to honour opacity transition
              img.style.transition = 'opacity 0.32s ease, transform 0.4s cubic-bezier(0.16,1,0.3,1)';
              img.style.opacity = '1';
              img.style.transform = 'translateX(0) scale(1)';
            });
          }

          requestAnimationFrame(function () {
            if (gen !== navGen) return;
            img.onload = function () { clearTimeout(loadFallback); afterLoad(); };
            img.onerror = function () { clearTimeout(loadFallback); afterLoad(); };
            img.src = p.src;
            var loadFallback = setTimeout(afterLoad, 700);
            // decode() waits for full pixel decode — reliable in Firefox unlike img.complete
            if (img.decode) img.decode().then(function () { clearTimeout(loadFallback); afterLoad(); }).catch(function () { });
          });
        }

        // probe starts the network request — doEnter fires after min 150ms exit time
        var probe = new Image();
        var probeReady = false;
        var minWaitDone = false;
        function maybeEnter() { if (probeReady && minWaitDone) doEnter(); }
        probe.onload = probe.onerror = function () { probeReady = true; maybeEnter(); };
        probe.src = p.src;
        // decode() fires after pixel decode — reliable Firefox alternative to img.complete
        if (probe.decode) probe.decode().then(function () { probeReady = true; maybeEnter(); }).catch(function () { });
        setTimeout(function () { minWaitDone = true; maybeEnter(); }, 150);
        setTimeout(doEnter, 600); // hard fallback

      } else {
        // INITIAL OPEN
        var openGen = ++navGen;
        // background blur moved to afterOpenLoad

        // image starts invisible — no content yet
        img.onload = null; img.onerror = null;
        img.src = '';
        img.style.transition = 'none';
        img.style.opacity = '0';
        img.style.transform = '';

        // info panel fully hidden — no stale text visible
        var infoEl2 = document.getElementById('lightbox-info');
        infoEl2.style.animation = 'none';
        infoEl2.style.opacity = '0';

        lb.classList.add('open');
        lb.scrollTop = 0;
        document.body.style.overflow = 'hidden';
        if (liftZone) liftZone.style.display = 'block';
        // allow other UI (cursor ring) to reset on lightbox open
        window.dispatchEvent(new Event('lightbox-open'));
        setTimeout(showFilmstrip, 300);

        var hint = document.getElementById('swipe-hint');
        if (hint) {
          hint.classList.add('visible');
          setTimeout(function () { hint.classList.remove('visible'); }, 2500);
        }

        var openLoadFired = false;
        function afterOpenLoad() {
          if (openLoadFired || openGen !== navGen) return;
          openLoadFired = true;
          img.onload = null; img.onerror = null;
          // Mobile: scroll-snap IIFE handles content — skip
          if (isMobile && mobileScrollToSlide) return;
          // text content set now — invisible, layout settled
          setLightboxBlur(p.src);
          setLightboxContent(p);
          loadSwipeNeighbors();
          requestAnimationFrame(function () {
            if (openGen !== navGen) return;
            animateInfo(0);
            void img.offsetWidth; // force reflow — Firefox transition fix
            img.style.transition = 'opacity 0.45s ease';
            img.style.opacity = '1';
          });
        }

        // handlers BEFORE src — Firefox-safe
        var openFallback;
        requestAnimationFrame(function () {
          img.onload = function () { clearTimeout(openFallback); afterOpenLoad(); };
          img.onerror = function () { clearTimeout(openFallback); afterOpenLoad(); };
          img.src = p.src;
          openFallback = setTimeout(afterOpenLoad, 700);
          // decode() waits for pixel decode — reliable in Firefox unlike img.complete
          if (img.decode) img.decode().then(function () { clearTimeout(openFallback); afterOpenLoad(); }).catch(function () { });
        });
      }
    }

    function closeLightbox() {
      var lb = document.getElementById('lightbox');
      var img = document.getElementById('lightbox-img');
      var activeGen = ++navGen; // invalidates all pending callbacks
      lb.classList.remove('open');
      document.body.style.overflow = '';
      clearTimeout(filmstripHideTimer);
      hideFilmstrip();
      if (liftZone) liftZone.style.display = 'none';

      document.getElementById('blur-layer-a').classList.remove('active');
      document.getElementById('blur-layer-b').classList.remove('active');
      // Clear hash on close
      if (window.location.hash) {
        history.replaceState(null, null, window.location.pathname + window.location.search);
      }

      // Delay DOM teardown until the opacity fade finishes
      setTimeout(function () {
        if (activeGen !== navGen) return; // Abort if user reopened lightbox quickly
        img.onerror = null;
        img.src = '';
        img.classList.remove('zoomed');
        img.style.transition = '';
        img.style.transform = '';
        img.style.transformOrigin = '';
        img.style.opacity = '';

        var info = document.getElementById('lightbox-info');
        if (info) {
          info.style.animation = 'none';
          info.style.opacity = '0';
          info.style.transition = '';
          info.style.filter = '';
          info.style.transform = '';
        }

        var content = document.getElementById('lightbox-content');
        if (content) {
          content.classList.remove('desc-open');
          content.style.transition = '';
          content.style.transform = '';
          content.style.transformOrigin = '';
          content.style.opacity = '';
        }

        if (isMobile) {

              var blurVal = Math.min(18, (dy / 300) * 18);
              var txtOpac = Math.max(0, 1 - dy / 180);
              info.style.transition = 'none';
              info.style.filter = 'blur(' + blurVal + 'px)';
              info.style.opacity = txtOpac;
            }
          }
        }, { passive: false });

        lbEl.addEventListener('touchend', function (e) {
          if (e.target.closest('#filmstrip-wrap, #filmstrip-lift-zone, .filmstrip-thumb')) return;
          if (e.touches.length < 2) {
            if (isPinching && e.touches.length === 1 && lbZoomLevel > 1) {
              dStartX = e.touches[0].clientX;
              dStartY = e.touches[0].clientY;
            }
            isPinching = false;

            if (lbZoomLevel <= 1 && isMobile) {
              var mWrap = document.getElementById('lightbox-img-wrap');
              var slides = mWrap.querySelectorAll('.snap-slide');
              for (var i = 0; i < slides.length; i++) {
                slides[i].style.transition = '';
                slides[i].style.opacity = '1';
              }
            }
          }

          if (!dLocked) return;
          var vy = 0;
          if (dPts.length >= 2) {
            var a = dPts[Math.max(0, dPts.length - 4)], b = dPts[dPts.length - 1];
            var dt = b.t - a.t;
            if (dt > 0) vy = (b.y - a.y) / dt;
          }
          if (dDY > 100 || vy > 0.35) {
            swipeHappened = true;
            var content = document.getElementById('lightbox-content');
            content.style.transition = 'transform 0.28s ease-out, opacity 0.28s ease-out';
            content.style.transform = 'translateY(' + window.innerHeight + 'px) rotate(-30deg)';
            content.style.opacity = '0';

            var info = document.getElementById('lightbox-info');
            if (info) {
              info.style.transition = 'opacity 0.2s ease, filter 0.2s ease';
              info.style.filter = 'blur(18px)';
              info.style.opacity = '0';
            }

            setTimeout(function () {
              closeLightbox();
            }, 280);
          } else {
            var content = document.getElementById('lightbox-content');
            content.style.transition = 'transform 0.35s cubic-bezier(0.16,1,0.3,1), opacity 0.35s ease';
            content.style.transform = '';
            content.style.opacity = '1';

            var info = document.getElementById('lightbox-info');
            if (info) {
              info.style.transition = 'opacity 0.35s ease, filter 0.35s ease';
              info.style.filter = '';
              info.style.opacity = '1';
            }

            setTimeout(function () {
              if (content) {
                content.style.transition = '';
                content.style.transformOrigin = '';
              }
              if (info) {
                info.style.transition = '';
              }
            }, 360);
          }
          dLocked = false;
          dChecked = false;
        }, { passive: true });
      })();
    }

    function revealCards() {
      var cards = document.querySelectorAll('.photo-card:not(.revealed)');
      cards.forEach(function (card) {
        var rect = card.getBoundingClientRect();
        if (rect.top < window.innerHeight - 60) {
          var img = card.querySelector('img');
          if (img && img.complete && img.naturalHeight !== 0) {
            card.classList.add('revealed');
          } else if (img && !img.dataset.loadListenerAttached) {
            img.dataset.loadListenerAttached = "true";
            img.addEventListener('load', function () {
              var r = card.getBoundingClientRect();
              if (r.top < window.innerHeight - 60) card.classList.add('revealed');
            });
          }
        }
      });
    }

    window.addEventListener('scroll', revealCards, { passive: true });

    // MASONRY — scroll reveal handles fade-in
    // aspect ratios cached in localStorage to prevent CLS on repeat visits
    var RATIO_CACHE_KEY = 'van_ratios_v1';
    var ratioCache = {};
    try {
      var stored = localStorage.getItem(RATIO_CACHE_KEY);
      if (stored) ratioCache = JSON.parse(stored);
    } catch (e) { }

    function saveRatioCache() {
      try { localStorage.setItem(RATIO_CACHE_KEY, JSON.stringify(ratioCache)); } catch (e) { }
    }

    function buildMasonry() {
      var m = document.getElementById('masonry');
      activePhotos.forEach(function (p, i) {
        var card = document.createElement('div');
        card.className = 'photo-card';
        var imgEl = document.createElement('img');
        var thumbPath = p.src.replace('photos/', 'photos/thumbs/');
        imgEl.src = thumbPath;
        imgEl.alt = p.title;
        imgEl.loading = 'lazy';

        // apply cached ratio immediately — prevents layout shift on repeat visits
        var cached = ratioCache[p.src];
        if (cached) {
          imgEl.style.aspectRatio = cached;
        } else {
          // first visit: read ratio after load, cache it
          imgEl.addEventListener('load', function () {
            if (imgEl.naturalWidth && imgEl.naturalHeight) {
              var r = (imgEl.naturalWidth / imgEl.naturalHeight).toFixed(4);
              ratioCache[p.src] = r;
              imgEl.style.aspectRatio = r;
              saveRatioCache();
            }
          });
        }

        var overlay = document.createElement('div');
        overlay.className = 'photo-card-overlay';
        overlay.innerHTML = '<div class="photo-card-title">' + p.title + '</div><div class="photo-card-year">' + p.year + '</div>';
        card.appendChild(imgEl);
        card.appendChild(overlay);
        card.addEventListener('click', (function (idx) {
          return function () { openLightbox(idx); };
        })(i));
        m.appendChild(card);
      });
      setTimeout(revealCards, 100);
    }

    // PARALLAX
    var scrollY = 0;
    window.addEventListener('scroll', function () { scrollY = window.scrollY; }, { passive: true });

    // CAROUSEL
    var ROW_CONFIG = [{ dir: -1 }, { dir: 1 }, { dir: -1 }, { dir: 1 }];
    // cruise speed scaled by device — mobile narrower so same px/frame looks faster
    var CRUISE_SPEED = isMobile ? 0.28 : (window.innerWidth < 1024 ? 0.36 : 0.45);
    var EASE_FRAMES = 120;
    var START_SPEED_MULT = 8.0;

    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function getCurrentSpeed(frame) {
      if (frame >= EASE_FRAMES) return CRUISE_SPEED;
      var t = frame / EASE_FRAMES;
      return CRUISE_SPEED * START_SPEED_MULT + (CRUISE_SPEED - CRUISE_SPEED * START_SPEED_MULT) * easeOutCubic(t);
    }

    var rowState = ROW_CONFIG.map(function (c) { return { dir: c.dir, offset: 0, setWidth: 0 }; });
    var easeFrame = 0;

    function buildCarousel() {
      var rowIds = ['row-0', 'row-1', 'row-2', 'row-3'];
      var rows = rowIds.map(function (id) { return document.getElementById(id); });

      // show/hide row-3 based on device
      if (isMobile) {
        rows[3].style.display = 'flex';
      } else {
        rows[3].style.display = 'none';
      }

      var activeRows = isMobile ? rows : rows.slice(0, 3);
      var activeRowCount = activeRows.length;

      if (carouselPhotos.length === 0) { startLoops(); return; }

      // rows stay visible; eager images handle their own fade-in
      activeRows.forEach(function (r) { r.style.opacity = '1'; });

      var groups = [];
      for (var g = 0; g < activeRowCount; g++) groups.push([]);
      carouselPhotos.forEach(function (p, i) { groups[i % activeRowCount].push(p); });

      var eagerImgs = [];

      activeRows.forEach(function (row, ri) {
        var group = groups[ri].length > 0 ? groups[ri] : carouselPhotos;
        var copies = Math.max(2, Math.ceil((window.innerWidth * 3) / 220 / group.length));

        for (var c = 0; c < copies * 2; c++) {
          group.forEach(function (p) {
            var img = document.createElement('img');
            var thumbPath = p.src.replace('photos/', 'photos/thumbs/');
            img.src = thumbPath; img.alt = p.title; img.draggable = false;
            if (c === 0) {
              img.loading = 'eager';
              // start invisible — fade in on load so images don't cut in on cold load
              img.style.opacity = '0';
              img.addEventListener('load', function () { img.style.opacity = '1'; });
              img.addEventListener('error', function () { img.style.opacity = '1'; });
              eagerImgs.push(img);
            } else {
              img.loading = 'lazy';
            }
            var idx = activePhotos.indexOf(p);
            img.addEventListener('click', (function (capturedIdx) {
              return function () { openLightbox(capturedIdx >= 0 ? capturedIdx : 0); };
            })(idx));
            row.appendChild(img);
          });
        }
      });

      var loaded = 0;
      var total = eagerImgs.length;

      function onImageReady() {
        if (++loaded < total) return;
        // defer to next paint — Firefox offsetWidth is 0 if read before layout pass
        requestAnimationFrame(function () {
          activeRows.forEach(function (row, ri) {
            var group = groups[ri].length > 0 ? groups[ri] : carouselPhotos;
            var copies = Math.max(2, Math.ceil((window.innerWidth * 3) / 220 / group.length));
            var imgs = Array.from(row.querySelectorAll('img'));
            var w = 0;
            for (var i = 0; i < group.length * copies && i < imgs.length; i++) w += (imgs[i].offsetWidth || 220) + 10;
            rowState[ri].setWidth = w > 0 ? w : group.length * copies * 230;
            if (ROW_CONFIG[ri].dir === 1) rowState[ri].offset = -rowState[ri].setWidth;
          });
          activeRows.forEach(function (r) { r.style.opacity = '1'; }); // already visible, belt-and-suspenders
          if (window.__onCarouselReady) window.__onCarouselReady();
          startLoops();
        });
      }

      if (total === 0) { activeRows.forEach(function (r) { r.style.opacity = '1'; }); startLoops(); return; }
      eagerImgs.forEach(function (img) {
        var counted = false;
        function countOnce() { if (!counted) { counted = true; onImageReady(); } }
        img.addEventListener('load', countOnce);
        img.addEventListener('error', countOnce);
        if (img.complete) {
          // already cached — decode() waits for pixel decode before resolving
          if (img.decode) {
            img.decode().then(countOnce).catch(countOnce);
          } else {
            // no decode() — nudge src to retrigger load event (cached, no network hit)
            var s = img.src; img.src = ''; img.src = s;
          }
        }
      });
    }

    function tick() {
      if (!heroVisible || !pageVisible) { heroRafId = null; return; }
      var rowIds = isMobile ? ['row-0', 'row-1', 'row-2', 'row-3'] : ['row-0', 'row-1', 'row-2'];
      var rows = rowIds.map(function (id) { return document.getElementById(id); });
      var speed = getCurrentSpeed(easeFrame);
      if (easeFrame < EASE_FRAMES + 10) easeFrame++;

      var px = [scrollY * 0.18, -scrollY * 0.12, scrollY * 0.22, -scrollY * 0.15];

      rowState.forEach(function (state, ri) {
        if (ri >= rows.length) return;
        state.offset += speed * state.dir;
        if (state.setWidth > 0) {
          if (state.dir === -1 && state.offset < -state.setWidth) state.offset += state.setWidth;
          if (state.dir === 1 && state.offset > 0) state.offset -= state.setWidth;
        }
        rows[ri].style.transform = 'translateX(' + (state.offset + px[ri]) + 'px)';
      });

      heroRafId = requestAnimationFrame(tick);
    }

    // CURSOR - mouse only
    var isMouseDevice = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    if (isMouseDevice) {
      var cursor = document.getElementById('cursor');
      var ring = document.getElementById('cursor-ring');
      var mx = 0, my = 0, rx = 0, ry = 0;
      var cursorVisible = false;

      document.addEventListener('mousemove', function (e) {
        mx = e.clientX; my = e.clientY;
        cursor.style.left = mx + 'px'; cursor.style.top = my + 'px';
        if (!cursorVisible) {
          cursorVisible = true;
          cursor.style.opacity = '1'; ring.style.opacity = '1';
        }
      });
      (function animateRing() { rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12; ring.style.left = rx + 'px'; ring.style.top = ry + 'px'; requestAnimationFrame(animateRing); })();
      document.addEventListener('click', function () { cursor.style.transform = 'translate(-50%,-50%) scale(0.6)'; setTimeout(function () { cursor.style.transform = 'translate(-50%,-50%) scale(1)'; }, 150); });
      // Fade out when cursor leaves the viewport — use both document and documentElement for cross-browser coverage
      function hideCursor() { cursor.style.opacity = '0'; ring.style.opacity = '0'; cursorVisible = false; }
      function showCursor() { if (cursorVisible) return; cursorVisible = true; cursor.style.opacity = '1'; ring.style.opacity = '1'; }
      document.addEventListener('mouseleave', hideCursor);
      document.documentElement.addEventListener('mouseleave', hideCursor);
      document.addEventListener('mouseenter', showCursor);
      document.documentElement.addEventListener('mouseenter', showCursor);
      document.addEventListener('contextmenu', function () { hideCursor(); cursor.style.transform = 'translate(-50%,-50%) scale(0.6)'; });
      // Delegated hover for cursor ring — works on dynamically added cards and carousel imgs
      var interactiveSelector = 'button, .photo-card, #scroll-hint, .carousel-row img';
      document.addEventListener('mouseover', function (e) {
        if (e.target.matches(interactiveSelector) || e.target.closest('.photo-card, #scroll-hint')) {
          ring.style.width = '44px'; ring.style.height = '44px'; ring.style.borderColor = 'rgba(221,216,207,0.4)';
        }
      });
      document.addEventListener('mouseout', function (e) {
        if (e.target.matches(interactiveSelector) || e.target.closest('.photo-card, #scroll-hint')) {
          ring.style.width = '28px'; ring.style.height = '28px'; ring.style.borderColor = 'rgba(221,216,207,0.25)';
        }
      });

      // reset ring when lightbox opens — hover context is lost when carousel img is covered
      window.addEventListener('lightbox-open', function () {
        ring.style.width = '28px'; ring.style.height = '28px'; ring.style.borderColor = 'rgba(221,216,207,0.25)';
      });
    }

    // FILMSTRIP
    var filmstripWrap = document.getElementById('filmstrip-wrap');
    var filmstripEl = document.getElementById('filmstrip');
    var filmstripHideTimer = null;
    var filmstripBuilt = false;
    var liftZone = document.getElementById('filmstrip-lift-zone');

    function buildFilmstrip() {
      if (filmstripBuilt) return;
      filmstripBuilt = true;

      var THUMB_W = window.innerWidth >= 640 ? 62 : 52;
      var pad = (window.innerWidth / 2) - (THUMB_W / 2);
      filmstripEl.style.paddingLeft = pad + 'px';
      filmstripEl.style.paddingRight = pad + 'px';

      activePhotos.forEach(function (p, i) {
        var thumb = document.createElement('div');
        thumb.className = 'filmstrip-thumb';
        thumb.dataset.idx = i;
        var img = document.createElement('img');
        var thumbPath = p.src.replace('photos/', 'photos/thumbs/');
        img.src = thumbPath;
        img.alt = p.title;
        img.loading = 'lazy';
        thumb.appendChild(img);
        thumb.addEventListener('click', (function (idx) {
          return function () {
            var d = idx === cur ? 0 : (idx > cur ? 1 : -1);
            cur = idx;
            openLightbox(idx, d);
          };
        })(i));
        filmstripEl.appendChild(thumb);
      });

      initFilmstripDrag();
    }

    var fsRaf = null;
    var fsVelocity = 0;
    var fsTarget = 0;
    var isManuallyNavigating = false;
    var fsSyncTarget = null;
    var fsSyncRaf = null;

    // Smooth lerp loop for mobile filmstrip tracking during swipe.
    // Uses frame-rate-independent exponential decay so the filmstrip
    // chases the target position without jitter or abrupt transitions.
    function startFsSync(target) {
      fsSyncTarget = target;
      if (fsSyncRaf) return; // loop already running — just updated target
      var prevTime = 0;
      function syncLoop(time) {
        if (fsSyncTarget === null) { fsSyncRaf = null; return; }
        var dt = prevTime ? Math.min(time - prevTime, 33) : 16;
        prevTime = time;
        var current = filmstripEl.scrollLeft;
        var diff = fsSyncTarget - current;
        if (Math.abs(diff) < 0.5) {
          filmstripEl.scrollLeft = fsSyncTarget;
          fsSyncRaf = null;
          fsSyncTarget = null;
          return;
        }
        // k=14: reaches 90% in ~165ms, 99% in ~330ms
        var alpha = 1 - Math.exp(-14 * dt / 1000);
        filmstripEl.scrollLeft = current + diff * alpha;
        fsSyncRaf = requestAnimationFrame(syncLoop);
      }
      fsSyncRaf = requestAnimationFrame(syncLoop);
    }

    function stopFsSync() {
      if (fsSyncRaf) { cancelAnimationFrame(fsSyncRaf); fsSyncRaf = null; }
      fsSyncTarget = null;
    }

    function updateFilmstrip() {
      var oldActive = filmstripEl.querySelector('.filmstrip-thumb.active');
      if (oldActive) oldActive.classList.remove('active');
      
      var active = filmstripEl.querySelector('.filmstrip-thumb[data-idx="' + cur + '"]');
      if (active) {
        active.classList.add('active');
        var wrapW = filmstripEl.offsetWidth;
        var thumbL = active.offsetLeft;
        var thumbW = active.offsetWidth;
        fsTarget = thumbL - wrapW / 2 + thumbW / 2;
        if (!isMobile || isManuallyNavigating) {
          if (fsRaf || fsSyncRaf) {
            // If already animating, drop into lerp mode for smooth continuous chasing
            if (fsRaf) {
              cancelAnimationFrame(fsRaf);
              fsRaf = null;
            }
            startFsSync(fsTarget);
          } else {
            // Cold start: play strict smooth cubic ease 
            stopFsSync();
            var startPos = filmstripEl.scrollLeft;
            var startTime = null;
            var duration = 400; // graceful duration

            function step(time) {
              if (!startTime) startTime = time;
              var elapsed = time - startTime;
              if (elapsed >= duration) {
                filmstripEl.scrollLeft = fsTarget;
                fsRaf = null;
                isManuallyNavigating = false;
                return;
              }
              var t = Math.min(1, elapsed / duration);
              // silky ease-out-quart
              var ease = 1 - Math.pow(1 - t, 4);
              filmstripEl.scrollLeft = startPos + (fsTarget - startPos) * ease;
              fsRaf = requestAnimationFrame(step);
            }
            fsRaf = requestAnimationFrame(step);
          }
        } else {
          startFsSync(fsTarget);
        }
      }
    }

    var isUserInteracting = false;
    document.getElementById('lightbox').addEventListener('touchstart', function () {
      isUserInteracting = true;
      clearTimeout(filmstripHideTimer);
    }, { passive: true });
    window.addEventListener('touchend', function () {
      isUserInteracting = false;
      if (filmstripWrap.classList.contains('visible')) {
        clearTimeout(filmstripHideTimer);
        filmstripHideTimer = setTimeout(hideFilmstrip, 2800);
      }
    }, { passive: true });

    document.getElementById('lightbox').addEventListener('mousedown', function () {
      isUserInteracting = true;
      clearTimeout(filmstripHideTimer);
    }, { passive: true });
    window.addEventListener('mouseup', function () {
      isUserInteracting = false;
      if (filmstripWrap.classList.contains('visible')) {
        clearTimeout(filmstripHideTimer);
        filmstripHideTimer = setTimeout(hideFilmstrip, 2800);
      }
    }, { passive: true });

    function showFilmstrip() {
      buildFilmstrip();
      updateFilmstrip();
      filmstripWrap.classList.add('visible');
      document.getElementById('lightbox').classList.add('filmstrip-visible');
      clearTimeout(filmstripHideTimer);
      if (!isUserInteracting) {
        filmstripHideTimer = setTimeout(hideFilmstrip, 2800);
      }
    }

    function hideFilmstrip() {
      filmstripWrap.classList.remove('visible');
      document.getElementById('lightbox').classList.remove('filmstrip-visible');
    }

    // keep filmstrip visible while hovering it
    filmstripWrap.addEventListener('mouseenter', function () { clearTimeout(filmstripHideTimer); });
    filmstripWrap.addEventListener('mouseleave', function () {
      // short grace — enough to prevent flicker if mouse clips the edge
      filmstripHideTimer = setTimeout(hideFilmstrip, 200);
    });
    filmstripWrap.addEventListener('touchstart', function () { clearTimeout(filmstripHideTimer); }, { passive: true });
    filmstripWrap.addEventListener('touchend', function () {
      filmstripHideTimer = setTimeout(hideFilmstrip, 2000);
    }, { passive: true });

    // invisible lift zone — hovering bottom of screen revives hidden filmstrip
    if (liftZone) {
      liftZone.addEventListener('mouseenter', function () {
        clearTimeout(filmstripHideTimer);
        showFilmstrip();
      });
      liftZone.addEventListener('mouseleave', function () {
        // if mouse left lift zone without entering filmstrip, hide immediately
        filmstripHideTimer = setTimeout(hideFilmstrip, 0);
      });
    }

    // mouse wheel scroll — momentum accumulator for smooth visual feel
    var wheelVelocity = 0;
    var wheelRafId = null;
    filmstripWrap.addEventListener('wheel', function (e) {
      e.preventDefault();
      wheelVelocity += (e.deltaY + e.deltaX) * 0.6; // accumulate, scaled down slightly
      clearTimeout(filmstripHideTimer);
      filmstripHideTimer = setTimeout(hideFilmstrip, 2000);
      if (!wheelRafId) {
        (function wheelLoop() {
          if (Math.abs(wheelVelocity) < 0.5) { wheelVelocity = 0; wheelRafId = null; return; }
          filmstripEl.scrollLeft += wheelVelocity;
          wheelVelocity *= 0.82; // friction — decay per frame
          wheelRafId = requestAnimationFrame(wheelLoop);
        })();
      }
    }, { passive: false });

    // click-drag scroll
    function initFilmstripDrag() {
      var isDragging = false;
      var dragStartX = 0;
      var scrollStart = 0;
      var dragMoved = false;

      filmstripEl.addEventListener('mousedown', function (e) {
        isDragging = true;
        dragMoved = false;
        dragStartX = e.clientX;
        scrollStart = filmstripEl.scrollLeft;
        filmstripEl.classList.add('dragging');
        clearTimeout(filmstripHideTimer);
      });

      document.addEventListener('mousemove', function (e) {
        if (!isDragging) return;
        var dx = e.clientX - dragStartX;
        if (Math.abs(dx) > 3) dragMoved = true;
        filmstripEl.scrollLeft = scrollStart - dx;
      });

      document.addEventListener('mouseup', function () {
        if (!isDragging) return;
        isDragging = false;
        filmstripEl.classList.remove('dragging');
        filmstripHideTimer = setTimeout(hideFilmstrip, 1500);
      });

      // suppress click on thumbs if we just dragged
      filmstripEl.addEventListener('click', function (e) {
        if (dragMoved) { e.stopPropagation(); dragMoved = false; }
      }, true);
    }


    // buildCarousel internally waits for images, then calls onReady
    // we hook into that by wrapping the final reveal
    function liftLoader() {
      var loader = document.getElementById('loader');
      loader.classList.add('lifting');
      setTimeout(function () { loader.style.display = 'none'; }, 750);
    }

    // Lift loader via direct callback — no MutationObserver (flaky in Firefox)
    var _loaderLifted = false;
    function safeLift() { if (!_loaderLifted) { _loaderLifted = true; liftLoader(); } }
    // Hard fallback: lift after 4s no matter what
    setTimeout(safeLift, 4000);
    // Expose for buildCarousel to call after rows are visible
    window.__onCarouselReady = function () { setTimeout(safeLift, 120); };

    buildCarousel();
    buildMasonry();

    // Visibility & Animation Loop Management
    function startLoops() {
      if (heroVisible && pageVisible) {
        if (!heroRafId) heroRafId = requestAnimationFrame(tick);
        if (!glowRafId && typeof animateGlow === 'function') glowRafId = requestAnimationFrame(animateGlow);
      }
    }
    var heroObs = new IntersectionObserver(function (entries) {
      heroVisible = entries[0].isIntersecting;
      startLoops();
    }, { threshold: 0 });
    heroObs.observe(document.getElementById('hero'));
    document.addEventListener('visibilitychange', function () {
      pageVisible = !document.hidden;
      startLoops();
    });

    // Deep Link Initial Load
    function checkHash() {
      var hash = window.location.hash.substring(1);
      if (!hash) return;
      for (var i = 0; i < activePhotos.length; i++) {
        if (slugify(activePhotos[i].title) === hash) {
          openLightbox(i);
          break;
        }
      }
    }
    // Defer slightly to ensure layout is ready
    setTimeout(checkHash, 300);
  </script>
</body>
